
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      containers:
        - name: backend
          image: taskflow-backend:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb:27017"
            - name: MONGO_DB
              value: "taskflow"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
spec:
  selector:
    app: taskflow-backend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
